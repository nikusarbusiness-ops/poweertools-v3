name: Build PowerTools

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ordnerstruktur für Maven vorbereiten
        run: |
          mkdir -p src/main/java/de/powertools
          mkdir -p src/main/resources
          if [ -f PowerToolsPlugin.java ]; then mv PowerToolsPlugin.java src/main/java/de/powertools/; fi
          if [ -f plugin.yml ]; then mv plugin.yml src/main/resources/; fi

      - name: Build JAR
        run: mvn -B clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v5
        with:
          name: PowerTools-JAR
          path: target/PowerTools-1.0.0.jar
